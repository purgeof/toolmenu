<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115_1年3班調查表</title>
  <style>
    :root {
      --primary-color: #0d9488;
      --primary-hover: #0f766e;
      --primary-light: #f0fdf4;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #cbd5e1;
      --subcard-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px 8px;
      margin: 0;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 20px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.4rem;
      color: var(--primary-color);
      letter-spacing: 0.5px;
    }

    /* 緊湊型題目區塊 */
    .form-group {
      margin-bottom: 12px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 10px;
    }

    .form-group:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* 加大題目字體、縮減間距 */
    .form-group label.question-title {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 1.05rem; /* 字體加大 */
      color: var(--text-main);
      line-height: 1.35;
    }

    .question-note {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* 緊湊型輸入框 */
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 8px 12px; /* 縮減內襯 */
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem; /* 大字體 */
      outline: none;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 60px; /* 縮減高度 */
    }

    input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    /* 單選題並排網格（精簡高度） */
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px; /* 緊湊間距 */
    }

    .radio-option {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      font-size: 1rem; /* 加大選項字體 */
      user-select: none;
      padding: 3px 0;
    }

    .radio-option input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      outline: none;
      margin-right: 6px;
      display: grid;
      place-content: center;
      transition: all 0.2s ease;
      cursor: pointer;
      flex-shrink: 0;
    }

    .radio-option input[type="radio"]::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      background-color: var(--primary-color);
    }

    .radio-option input[type="radio"]:checked {
      border-color: var(--primary-color);
    }

    .radio-option input[type="radio"]:checked::before {
      transform: scale(1);
    }

    /* 動態隱藏子區塊樣式 */
    .sub-panel {
      display: none;
      width: 100%;
      background-color: var(--subcard-bg);
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 4px;
      border-left: 3px solid var(--primary-color);
    }

    .sub-panel .sub-field {
      margin-bottom: 8px;
    }

    .sub-panel .sub-field:last-child {
      margin-bottom: 0;
    }

    .sub-panel label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(13, 148, 136, 0.35);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      background-color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 成功訊息彈窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background-color: var(--primary-color);
      color: white;
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      transform: scale(0.85);
      transition: transform 0.25s ease;
      max-width: 80%;
      width: 280px;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h3 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .modal-card p {
      margin: 0;
      font-size: 1.05rem;
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>115年_1年3班調查表</h2>
    
    <form id="surveyForm">
      
      <!-- 1. 學生姓名 -->
      <div class="form-group">
        <label class="question-title">1. 學生姓名</label>
        <input type="text" id="studentName" required placeholder="請輸入姓名">
      </div>

      <!-- 2. 學生性別 -->
      <div class="form-group">
        <label class="question-title">2. 學生性別</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="studentGender" value="男" required> 男
          </label>
          <label class="radio-option">
            <input type="radio" name="studentGender" value="女"> 女
          </label>
        </div>
      </div>

      <!-- 3. 學生座號 -->
      <div class="form-group">
        <label class="question-title">3. 學生座號</label>
        <input type="number" id="studentSeat" required placeholder="例如：12">
      </div>

      <!-- 4. 家中電話 -->
      <div class="form-group">
        <label class="question-title">4. 家中電話 <span class="question-note">(若沒有請填「無」)</span></label>
        <input type="text" id="homePhone" required placeholder="若無請填「無」">
      </div>

      <!-- 5. 父親姓名 -->
      <div class="form-group">
        <label class="question-title">5. 父親姓名</label>
        <input type="text" id="fatherName" placeholder="請輸入父親姓名">
      </div>

      <!-- 6. 父親手機 -->
      <div class="form-group">
        <label class="question-title">6. 父親手機</label>
        <input type="text" id="fatherPhone" placeholder="例如：0912345678">
      </div>

      <!-- 7. 母親姓名 -->
      <div class="form-group">
        <label class="question-title">7. 母親姓名</label>
        <input type="text" id="motherName" placeholder="請輸入母親姓名">
      </div>

      <!-- 8. 母親電話 -->
      <div class="form-group">
        <label class="question-title">8. 母親電話</label>
        <input type="text" id="motherPhone" placeholder="例如：0912345678">
      </div>

      <!-- 9. 其他聯絡人 -->
      <div class="form-group">
        <label class="question-title">9. 其他重要聯絡人電話 <span class="question-note">(若沒有請填「無」)</span></label>
        <input type="text" id="otherContact" required placeholder="例：祖母0917383628 (若無請填無)">
      </div>

      <!-- 10. 父母關係為何 -->
      <div class="form-group">
        <label class="question-title">10. 父母關係為何</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="parentRelation" value="同住" required> 同住
          </label>
          <label class="radio-option">
            <input type="radio" name="parentRelation" value="分居"> 分居
          </label>
          <label class="radio-option">
            <input type="radio" name="parentRelation" value="離婚"> 離婚
          </label>
          <label class="radio-option">
            <input type="radio" name="parentRelation" value="其他"> 其他
          </label>

          <!-- 動態展開離婚子選項 -->
          <div class="sub-panel" id="divorcePanel">
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="divorceDetail" value="與母同住" id="divorceDetail1"> 與母同住
              </label>
              <label class="radio-option">
                <input type="radio" name="divorceDetail" value="與父同住" id="divorceDetail2"> 與父同住
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 11. 是否有兄姊在本校就讀 -->
      <div class="form-group">
        <label class="question-title">11. 是否有兄姊在本校就讀</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="hasSiblings" value="是" required> 是
          </label>
          <label class="radio-option">
            <input type="radio" name="hasSiblings" value="否"> 否
          </label>
        </div>
        <div class="sub-panel" id="siblingPanel">
          <div class="sub-field">
            <label for="siblingInfo">請填寫兄姊的稱謂、班級及姓名：</label>
            <input type="text" id="siblingInfo" placeholder="例：哥哥 4年2班 張大華">
          </div>
        </div>
      </div>

      <!-- 12. 是否為原住民學生 -->
      <div class="form-group">
        <label class="question-title">12. 是否為原住民學生</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="isIndigenous" value="是" required> 是
          </label>
          <label class="radio-option">
            <input type="radio" name="isIndigenous" value="否"> 否
          </label>
        </div>
      </div>

      <!-- 13. 是否為身障學生或子女 -->
      <div class="form-group">
        <label class="question-title">13. 是否為身心障礙學生或身心障礙人士子女</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="isDisabled" value="是" required> 是
          </label>
          <label class="radio-option">
            <input type="radio" name="isDisabled" value="否"> 否
          </label>
        </div>
      </div>

      <!-- 14. 是否為低收入戶學生 -->
      <div class="form-group">
        <label class="question-title">14. 是否有低收戶證明 <span class="question-note">(需附114年證明)</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="isLowIncome" value="是" required> 是
          </label>
          <label class="radio-option">
            <input type="radio" name="isLowIncome" value="否"> 否
          </label>
        </div>
      </div>

      <!-- 15. 是否為中低收入戶學生 -->
      <div class="form-group">
        <label class="question-title">15. 是否有中低收戶證明 <span class="question-note">(需附114年證明)</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="isMidLowIncome" value="是" required> 是
          </label>
          <label class="radio-option">
            <input type="radio" name="isMidLowIncome" value="否"> 否
          </label>
        </div>
      </div>

      <!-- 16. 本學期午餐繳費方式 -->
      <div class="form-group">
        <label class="question-title">16. 本學期午餐繳費方式</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="lunchFee" value="全繳" required>全繳
          </label>
          <label class="radio-option">
            <input type="radio" name="lunchFee" value="月繳">月繳
          </label>
          <label class="radio-option">
            <input type="radio" name="lunchFee" value="領有午餐補助證明">領有補助
          </label>
          <label class="radio-option">
            <input type="radio" name="lunchFee" value="午餐自理">自理
          </label>
        </div>
      </div>

      <!-- 17. 本學期欲飲用的乳品 -->
      <div class="form-group">
        <label class="question-title">17. 本學期要飲用的乳品</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="lunchMilk" value="牛奶" required> 牛奶
          </label>
          <label class="radio-option">
            <input type="radio" name="lunchMilk" value="豆奶"> 豆奶
          </label>
        </div>
      </div>

      <!-- 18. 本學期放學後接送方式 -->
      <div class="form-group">
        <label class="question-title">18. 本學期放學後接送方式</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="pickupMethod" value="家長接送" required> 家長接送
          </label>
          <label class="radio-option">
            <input type="radio" name="pickupMethod" value="安親班"> 安親班
          </label>
          <label class="radio-option">
            <input type="radio" name="pickupMethod" value="課後照顧班"> 課後照顧班
          </label>

          <div class="sub-panel" id="afterSchoolPanel">
            <div class="sub-field">
              <label for="afterSchoolName">安親班名稱</label>
              <input type="text" id="afterSchoolName" placeholder="例如：必勝文理補習班">
            </div>
            <div class="sub-field">
              <label for="afterSchoolPhone">安親班電話</label>
              <input type="text" id="afterSchoolPhone" placeholder="例如：8653269">
            </div>
          </div>
        </div>
      </div>

      <!-- 19. 孩子飲食特殊情況說明 -->
      <div class="form-group">
        <label class="question-title">19. 孩子飲食特殊情況說明 <span class="question-note">(若無請填「無」)</span></label>
        <textarea id="dietSpecial" required placeholder="若沒有請填寫「無」"></textarea>
      </div>

      <!-- 20. 孩子需要老師特別注意的事項說明 -->
      <div class="form-group">
        <label class="question-title">20. 孩子需要老師特別注意事項 <span class="question-note">(若無請填「無」)</span></label>
        <textarea id="teacherNote" required placeholder="若沒有請填寫「無」"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">送出問卷</button>
    </form>
  </div>

  <!-- 成功訊息彈窗 -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-card">
      <h3>成功送出！</h3>
      <p>感謝您的填寫。</p>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxROFCqsu-q8Qw71H2d49STrkXE6xELzVTWQ32Prdoe0kAI8vZh7LMrbF__rtB8iPVM/exec";

    // 10 題「離婚」動態展開
    const parentRadios = document.querySelectorAll('input[name="parentRelation"]');
    const divorcePanel = document.getElementById('divorcePanel');
    const divorceDetailRadios = document.querySelectorAll('input[name="divorceDetail"]');

    parentRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === '離婚') {
          divorcePanel.style.display = 'block';
          document.getElementById('divorceDetail1').required = true;
        } else {
          divorcePanel.style.display = 'none';
          document.getElementById('divorceDetail1').required = false;
          divorceDetailRadios.forEach(r => r.checked = false);
        }
      });
    });

    // 11 題「兄姊就讀」動態展開
    const siblingRadios = document.querySelectorAll('input[name="hasSiblings"]');
    const siblingPanel = document.getElementById('siblingPanel');
    const siblingInfo = document.getElementById('siblingInfo');

    siblingRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === '是') {
          siblingPanel.style.display = 'block';
          siblingInfo.required = true;
        } else {
          siblingPanel.style.display = 'none';
          siblingInfo.required = false;
          siblingInfo.value = '';
        }
      });
    });

    // 18 題「接送方式」安親班動態展開
    const pickupRadios = document.querySelectorAll('input[name="pickupMethod"]');
    const afterSchoolPanel = document.getElementById('afterSchoolPanel');
    const afterSchoolName = document.getElementById('afterSchoolName');
    const afterSchoolPhone = document.getElementById('afterSchoolPhone');

    pickupRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === '安親班') {
          afterSchoolPanel.style.display = 'block';
          afterSchoolName.required = true;
          afterSchoolPhone.required = true;
        } else {
          afterSchoolPanel.style.display = 'none';
          afterSchoolName.required = false;
          afterSchoolPhone.required = false;
          afterSchoolName.value = '';
          afterSchoolPhone.value = '';
        }
      });
    });

    // Modal 邏輯
    const successModal = document.getElementById('successModal');
    let autoCloseTimer;

    function showModal() {
      successModal.classList.add('active');
      autoCloseTimer = setTimeout(() => {
        closeModal();
      }, 2500);
    }

    function closeModal() {
      successModal.classList.remove('active');
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
    }

    successModal.addEventListener('click', closeModal);

    // 提交邏輯
    const form = document.getElementById('surveyForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      submitBtn.disabled = true;

      const getRadioValue = (name) => {
        const checkedOption = document.querySelector(`input[name="${name}"]:checked`);
        return checkedOption ? checkedOption.value : '';
      };

      let parentRelationValue = getRadioValue('parentRelation');
      if (parentRelationValue === '離婚') {
        const divorceDetail = getRadioValue('divorceDetail');
        if (divorceDetail) {
          parentRelationValue = `離婚(${divorceDetail})`;
        }
      }

      const formData = new URLSearchParams();
      formData.append('studentName', document.getElementById('studentName').value);
      formData.append('studentGender', getRadioValue('studentGender'));
      formData.append('studentSeat', document.getElementById('studentSeat').value);
      formData.append('homePhone', document.getElementById('homePhone').value);
      formData.append('fatherName', document.getElementById('fatherName').value);
      formData.append('fatherPhone', document.getElementById('fatherPhone').value);
      formData.append('motherName', document.getElementById('motherName').value);
      formData.append('motherPhone', document.getElementById('motherPhone').value);
      formData.append('otherContact', document.getElementById('otherContact').value);
      formData.append('parentRelation', parentRelationValue);
      formData.append('hasSiblings', getRadioValue('hasSiblings'));
      formData.append('siblingInfo', siblingInfo.value);
      formData.append('isIndigenous', getRadioValue('isIndigenous'));
      formData.append('isDisabled', getRadioValue('isDisabled'));
      formData.append('isLowIncome', getRadioValue('isLowIncome'));
      formData.append('isMidLowIncome', getRadioValue('isMidLowIncome'));
      formData.append('lunchFee', getRadioValue('lunchFee'));
      formData.append('lunchMilk', getRadioValue('lunchMilk'));
      formData.append('pickupMethod', getRadioValue('pickupMethod'));
      formData.append('afterSchoolName', afterSchoolName.value);
      formData.append('afterSchoolPhone', afterSchoolPhone.value);
      formData.append('dietSpecial', document.getElementById('dietSpecial').value);
      formData.append('teacherNote', document.getElementById('teacherNote').value);

      showModal();
      form.reset();
      divorcePanel.style.display = 'none';
      siblingPanel.style.display = 'none';
      afterSchoolPanel.style.display = 'none';

      setTimeout(() => {
        submitBtn.disabled = false;
      }, 1000);

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData.toString()
      }).catch(err => {
        console.error('背景發送異常：', err);
      });
    });
  </script>
</body>
</html>
